<head>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/brand.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230F0F10'/%3E%3Cpolygon points='32,12 56,32 8,32' fill='%23C9A03A'/%3E%3Crect x='12' y='32' width='40' height='24' fill='%23F4EEE3'/%3E%3Crect x='26' y='40' width='12' height='16' fill='%230F0F10'/%3E%3C/svg%3E" />

  <!-- Loading screen so the page never flashes white before React mounts -->
  <style>
    #__app_loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #0F0F10;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      transition: opacity .4s ease;
    }
    #__app_loading.fading { opacity: 0; pointer-events: none; }
    #__app_loading .mark { width: 220px; max-width: 62vw; height: auto; display: block; }
    #__app_loading .bar {
      width: 180px; height: 2px;
      background: rgba(244,238,227,.1);
      border-radius: 2px; overflow: hidden;
      position: relative;
    }
    #__app_loading .bar::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, #C9A03A, transparent);
      animation: load-sweep 1.4s ease-in-out infinite;
    }
    @keyframes load-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="__app_loading" aria-hidden="true">
    <img class="mark" src="../assets/logo-light.svg" alt="Ideal Roof &amp; Exterior Pros" width="2112" height="1016" />
    <div class="bar" role="progressbar" aria-label="Loading"></div>
  </div>

  <div id="root"></div>

  <!-- Production React (minified UMD) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Pre-compiled app (no in-browser Babel) -->
  <script src="app.js"></script>

  <script>
    (function () {
      var overlay = document.getElementById('__app_loading');
      var root = document.getElementById('root');
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        overlay.classList.add('fading');
        setTimeout(function () { overlay.remove(); }, 450);
      }
      var observer = new MutationObserver(function () {
        if (root && root.childNodes.length > 0) finish();
      });
      observer.observe(root, { childList: true });
      setTimeout(finish, 4000);
    })();
  </script>
</body>
</html>
